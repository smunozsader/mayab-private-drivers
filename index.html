  function esc(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function optionsFor(list, withFare){
    return list.map(function(z){
      return '<option value="'+esc(z.name)+'">'+esc(z.name)+(withFare?(' — $'+z.fare+' MXN'):'')+'</option>';
    }).join('');
  }

  function rowsFor(list){
    return list.map(function(z){
      return '<tr><td>'+esc(z.name)+'</td><td style="font-weight:700">$'+z.fare+' MXN</td></tr>';
    }).join('');
  }

    var svcNames = {transfer:t.svcNameTransfer, hourly:t.svcNameHourly, destino:t.svcNameDestino, rental:t.svcNameRental};

    lines.push(t.waServiceLabel + (svcNames[state.service] || state.service));

    if (state.service === 'hourly') lines.push(t.waHorasLabel + state.horas + t.waHorasMinSuffix);
    if (state.service === 'rental') lines.push(t.waModalidadLabel + (state.rentalType === 'dia' ? t.waFullDay : t.waByHour));

  function attachListeners(){
    var root = document.getElementById('app');

    root.querySelectorAll('[data-action="setLang"]').forEach(function(btn){
      btn.addEventListener('click', function(){ state.lang = btn.getAttribute('data-lang'); render(); });
    });
    root.querySelectorAll('[data-action="setService"]').forEach(function(btn){
      btn.addEventListener('click', function(){
        state.service = btn.getAttribute('data-service');
        render();
        var scrollTo = btn.getAttribute('data-scroll');
        if (scrollTo) {
          setTimeout(function(){
            var el = document.getElementById(scrollTo);
            if (el) el.scrollIntoView({behavior:'smooth'});
          }, 30);
        }
      });
    });
    root.querySelectorAll('[data-action="pickDestino"]').forEach(function(btn){
      btn.addEventListener('click', function(){
        state.service = 'destino';
        state.destino = btn.getAttribute('data-destino');
        render();
        setTimeout(function(){
          var el = document.getElementById('reservar');
          if (el) el.scrollIntoView({behavior:'smooth'});
        }, 30);
      });
    });
    root.querySelectorAll('[data-action="setRental"]').forEach(function(btn){
      btn.addEventListener('click', function(){ state.rentalType = btn.getAttribute('data-rental'); render(); });
    });
    var toggleBtn = root.querySelector('[data-action="toggleFullTable"]');
    if (toggleBtn) toggleBtn.addEventListener('click', function(){ state.showFullTable = !state.showFullTable; render(); });
    var incBtn = root.querySelector('[data-action="incPassengers"]');
    if (incBtn) incBtn.addEventListener('click', function(){ state.passengers = Math.min(4, state.passengers+1); render(); });
    var decBtn = root.querySelector('[data-action="decPassengers"]');
    if (decBtn) decBtn.addEventListener('click', function(){ state.passengers = Math.max(1, state.passengers-1); render(); });

    root.querySelectorAll('[data-bind]').forEach(function(el){
      var key = el.getAttribute('data-bind');
      var evt = (el.tagName === 'SELECT') ? 'change' : 'input';
      el.addEventListener(evt, function(){
        if (key === 'horas') {
          var v = parseInt(el.value || '3', 10);
          if (isNaN(v)) v = 3;
          state.horas = Math.max(3, v);
        } else {
          state[key] = el.value;
        }
        // Avoid re-render stealing focus from text inputs while typing; only full re-render on select/blur-like fields.
        if (el.tagName === 'SELECT' || key === 'horas') {
          render();
        }
      });
      if (el.tagName !== 'SELECT' && key !== 'horas') {
        el.addEventListener('blur', function(){ render(); });
      }
    });
  }

  render();
})();
