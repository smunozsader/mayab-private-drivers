      '<a href="#reservar" style="flex:1;display:inline-flex;align-items:center;justify-content:center;background:var(--terracotta-strong);color:var(--white);font-weight:700;font-size:15.5px;padding:12px 14px;border-radius:999px">'+esc(t.heroCta1)+'</a>'+
    '</div>'+

    '<button type="button" id="backToTopBtn" class="back-to-top" aria-label="'+esc(t.backToTop||'Subir al inicio')+'">'+ICONS.arrowUp+'</button>'+

    '</div>';

    document.getElementById('app').innerHTML = html;
    attachListeners();
  }

  function attachListeners(){
    var root = document.getElementById('app');

    root.querySelectorAll('[data-action="setLang"]').forEach(function(btn){
      btn.addEventListener('click', function(){ state.lang = btn.getAttribute('data-lang'); render(); });
    });
    var menuBtn = root.querySelector('[data-action="toggleMobileMenu"]');
    if (menuBtn) menuBtn.addEventListener('click', function(){ state.mobileMenuOpen = !state.mobileMenuOpen; render(); });
    root.querySelectorAll('[data-action="closeMobileMenu"]').forEach(function(a){
      a.addEventListener('click', function(e){
        e.preventDefault();
        var target = a.getAttribute('href');
        state.mobileMenuOpen = false;
        render();
        setTimeout(function(){
          var el = document.querySelector(target);
          if (el) el.scrollIntoView({behavior:'smooth'});
        }, 30);
      });
    });
    root.querySelectorAll('[data-action="setDestFilter"]').forEach(function(btn){
      btn.addEventListener('click', function(){ state.destFilter = btn.getAttribute('data-filter'); render(); });
    });
    root.querySelectorAll('[data-action="setService"]').forEach(function(btn){
      btn.addEventListener('click', function(){
        state.service = btn.getAttribute('data-service');
        render();
        var scrollTo = btn.getAttribute('data-scroll');
        if (scrollTo) {
          setTimeout(function(){
            var el = document.getElementById(scrollTo);
            if (el) el.scrollIntoView({behavior:'smooth'});
          }, 30);
        }
      });
    });
    root.querySelectorAll('[data-action="pickDestino"]').forEach(function(btn){
      btn.addEventListener('click', function(){
        state.service = 'destino';
        state.destino = btn.getAttribute('data-destino');
        render();
        setTimeout(function(){
          var el = document.getElementById('reservar');
          if (el) el.scrollIntoView({behavior:'smooth'});
        }, 30);
      });
    });
    root.querySelectorAll('[data-action="setRental"]').forEach(function(btn){
      btn.addEventListener('click', function(){ state.rentalType = btn.getAttribute('data-rental'); render(); });
    });
    var toggleBtn = root.querySelector('[data-action="toggleFullTable"]');
    if (toggleBtn) toggleBtn.addEventListener('click', function(){ state.showFullTable = !state.showFullTable; render(); });
    var incBtn = root.querySelector('[data-action="incPassengers"]');
    if (incBtn) incBtn.addEventListener('click', function(){ state.passengers = Math.min(4, state.passengers+1); render(); });
    var decBtn = root.querySelector('[data-action="decPassengers"]');
    if (decBtn) decBtn.addEventListener('click', function(){ state.passengers = Math.max(1, state.passengers-1); render(); });

    root.querySelectorAll('[data-bind]').forEach(function(el){
      var key = el.getAttribute('data-bind');
      var evt = (el.tagName === 'SELECT') ? 'change' : 'input';
      el.addEventListener(evt, function(){
        if (key === 'horas') {
          var v = parseInt(el.value || '3', 10);
          if (isNaN(v)) v = 3;
          state.horas = Math.max(3, v);
        } else {
          state[key] = el.value;
        }
        // Avoid re-render stealing focus from text inputs while typing; only full re-render on select/blur-like fields.
        if (el.tagName === 'SELECT' || key === 'horas') {
          render();
        }
      });
      if (el.tagName !== 'SELECT' && key !== 'horas') {
        el.addEventListener('blur', function(){ render(); });
      }
    });
  }

  render();

  document.addEventListener('click', function(e){
    var btn = e.target.closest && e.target.closest('#backToTopBtn');
    if (btn) window.scrollTo({top:0, behavior:'smooth'});
  });
  window.addEventListener('scroll', function(){
    var btn = document.getElementById('backToTopBtn');
    if (!btn) return;
    if (window.scrollY > 500) btn.classList.add('visible'); else btn.classList.remove('visible');
  }, {passive:true});
})();
</script>
</body>
</html>
