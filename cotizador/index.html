<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#0B413B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cotizador">
<link rel="manifest" href="/cotizador/manifest.json">
<link rel="apple-touch-icon" href="/cotizador/icon-192.png">
<link rel="icon" href="/cotizador/icon-192.png">
<title>Cotizador Mayab</title>
<style>
:root{
  --cream:#FBF3E6; --cream-soft:#F3E8D4; --ink:#15323A; --ink-soft:#52676B;
  --petrol:#0E5950; --petrol-deep:#0B413B; --terracotta:#D2652E; --terracotta-strong:#B84F22;
  --line:rgba(21,50,58,0.14); --white:#FFFFFF;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--cream);color:var(--ink);padding:env(safe-area-inset-top,0) max(16px,env(safe-area-inset-right,0)) max(24px,env(safe-area-inset-bottom,0)) max(16px,env(safe-area-inset-left,0));-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Baloo 2',system-ui,sans-serif;margin:0}
.wrap{max-width:520px;margin:0 auto;padding-top:18px}
header{display:flex;align-items:center;gap:10px;margin-bottom:18px}
header .logo{width:40px;height:40px;border-radius:11px;background:var(--petrol-deep);display:flex;align-items:center;justify-content:center;color:var(--terracotta);font-family:'Baloo 2';font-weight:800;font-size:20px;flex:none}
header h1{font-size:21px;color:var(--petrol-deep)}
header p{margin:2px 0 0;font-size:13px;color:var(--ink-soft)}
.card{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.card h2{font-size:15px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);margin-bottom:14px}
.row{display:flex;gap:10px;margin-bottom:12px}
.row>div{flex:1;min-width:0}
label{display:block;font-size:13.5px;font-weight:700;color:var(--ink);margin-bottom:5px}
input[type=number],select{width:100%;padding:10px 11px;border-radius:9px;border:1px solid var(--line);font-size:16px;color:var(--ink);background:var(--cream);font-family:inherit}
input[type=number]:focus,select:focus{outline:2px solid var(--petrol);outline-offset:1px}
.toggle-group{display:flex;gap:8px;flex-wrap:wrap}
.toggle-btn{flex:1 1 auto;padding:9px 12px;border-radius:999px;border:1.5px solid var(--petrol);background:var(--cream);color:var(--petrol-deep);font-size:13.5px;font-weight:700;cursor:pointer;text-align:center}
.toggle-btn.active{background:var(--petrol-deep);color:var(--white);border-color:var(--petrol-deep)}
.hint{font-size:12px;color:var(--ink-soft);margin-top:4px;line-height:1.4}
.adv-toggle{font-size:13.5px;font-weight:700;color:var(--terracotta-strong);background:none;border:none;padding:0;cursor:pointer;margin-bottom:10px;display:inline-flex;align-items:center;gap:5px}
.adv-body{display:none}
.adv-body.open{display:block}
.result{background:var(--petrol-deep);color:var(--white);border-radius:18px;padding:22px;text-align:center;position:sticky;bottom:12px;box-shadow:0 8px 24px rgba(11,65,59,0.35)}
.result .label{font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:rgba(255,255,255,0.65);margin-bottom:4px}
.result .price{font-family:'Baloo 2';font-weight:800;font-size:38px;color:var(--terracotta);line-height:1.1}
.result .sub{font-size:13.5px;color:rgba(255,255,255,0.78);margin-top:6px}
.breakdown{display:flex;flex-direction:column;gap:6px;margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,0.18);text-align:left;font-size:13.5px}
.breakdown div{display:flex;justify-content:space-between;color:rgba(255,255,255,0.85)}
.breakdown strong{color:var(--white)}
.footer-note{font-size:12px;color:var(--ink-soft);text-align:center;margin:18px 0 6px;line-height:1.5}
.action-row{display:flex;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,0.18);flex-wrap:wrap}
.action-btn{flex:1 1 140px;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 12px;border-radius:999px;font-size:13.5px;font-weight:700;text-decoration:none;text-align:center}
.action-btn.cal{background:var(--white);color:var(--petrol-deep)}
.action-btn.reg{background:var(--terracotta-strong);color:var(--white)}
.install-banner{background:var(--cream-soft);border:1px dashed var(--petrol);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--ink-soft);margin-bottom:14px;line-height:1.5}
.install-banner b{color:var(--petrol-deep)}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";

var state = {
  cliente: '',
  destino: '',
  fecha: '',
  km: '',
  minIda: '',
  tipoViaje: 'redondo_espera',
  horasEspera: 0,
  casetaIda: 0,
  casetaVuelta: 0,
  pasajeros: 1,
  advOpen: false,
  precioGas: 1.40,
  tarifaManejo: 300,
  tarifaEspera: 150,
  margen: 30
};

function pad2(n){ return (n<10?'0':'')+n; }
function gcalLink(r){
  var title = encodeURIComponent('Mayab — ' + (state.destino || 'Viaje') + (state.cliente ? (' · ' + state.cliente) : ''));
  var details = encodeURIComponent(
    'Cliente: ' + (state.cliente || '—') + '\n' +
    'Destino: ' + (state.destino || '—') + '\n' +
    'Precio: ' + money(r.precioRedondeado) + (r.pasajeros>1?(' (' + money(r.precioPorPersona) + '/persona)'):'') + '\n' +
    'Pasajeros: ' + r.pasajeros + '\n' +
    'Distancia total: ' + r.distanciaTotal.toFixed(1) + ' km\n' +
    'Generado con el cotizador privado Mayab'
  );
  var datesParam = '';
  if (state.fecha){
    var d = state.fecha.replace(/-/g,'');
    datesParam = '&dates=' + d + '/' + d;
  }
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + title + datesParam + '&details=' + details;
}

function slugify(s){
  return String(s||'')
    .normalize('NFD').replace(/[̀-ͯ]/g,'')
    .toLowerCase()
    .replace(/[^a-z0-9]+/g,'-')
    .replace(/^-+|-+$/g,'')
    .slice(0,40);
}

// Id determinístico (mismo cliente+destino+fecha siempre produce el mismo id),
// para que re-abrir el mismo link actualice el mismo viaje en vez de duplicarlo.
function tripId(){
  var base = slugify(state.cliente) + '_' + slugify(state.destino) + '_' + slugify(state.fecha);
  return 't-' + (base || 'viaje') + '-' + Math.abs(hashStr(state.cliente+'|'+state.destino+'|'+state.fecha)).toString(36);
}
function hashStr(s){
  var h = 0;
  for (var i=0;i<s.length;i++){ h = ((h<<5)-h) + s.charCodeAt(i); h |= 0; }
  return h;
}

function regLink(r){
  var id = tripId();
  var params = [
    'id=' + encodeURIComponent(id),
    'cliente=' + encodeURIComponent(state.cliente||''),
    'destino=' + encodeURIComponent(state.destino||''),
    'fecha=' + encodeURIComponent(state.fecha||''),
    'precio=' + encodeURIComponent(r.precioRedondeado),
    'estatus=reservado'
  ].join('&');
  return 'https://claude.ai/artifact/KMPSU6z8EPNwnQFyMDVayi?' + params;
}

function loadDefaults(){
  try{
    var saved = localStorage.getItem('cotizadorMayabDefaults');
    if (saved){
      var d = JSON.parse(saved);
      ['precioGas','tarifaManejo','tarifaEspera','margen'].forEach(function(k){
        if (typeof d[k] === 'number') state[k] = d[k];
      });
    }
  }catch(e){}
}
function saveDefaults(){
  try{
    localStorage.setItem('cotizadorMayabDefaults', JSON.stringify({
      precioGas: state.precioGas, tarifaManejo: state.tarifaManejo,
      tarifaEspera: state.tarifaEspera, margen: state.margen
    }));
  }catch(e){}
}

function num(v, fallback){
  var n = parseFloat(v);
  return isNaN(n) ? (fallback || 0) : n;
}

function money(n){
  return '$' + Math.round(n).toLocaleString('es-MX') + ' MXN';
}

function calcular(){
  var km = num(state.km, 0);
  var minIda = num(state.minIda, 0);
  var esRedondo = state.tipoViaje !== 'ida_sin_regreso';
  var factor = esRedondo ? 2 : 1;
  var distanciaTotal = km * factor;
  var tiempoManejoHoras = (minIda * factor) / 60;
  var horasEspera = num(state.horasEspera, 0);
  var casetaIda = num(state.casetaIda, 0);
  var casetaVuelta = esRedondo ? num(state.casetaVuelta || state.casetaIda, 0) : 0;

  var costoGasolina = distanciaTotal * num(state.precioGas, 0);
  var costoCasetas = casetaIda + casetaVuelta;
  var costoManejo = tiempoManejoHoras * num(state.tarifaManejo, 0);
  var costoEspera = horasEspera * num(state.tarifaEspera, 0);
  var costoDirecto = costoGasolina + costoCasetas;
  var costoManoObra = costoManejo + costoEspera;
  var costoTotal = costoDirecto + costoManoObra;
  var margen = num(state.margen, 0);
  var precioConMargen = costoTotal * (1 + margen / 100);
  var precioRedondeado = Math.round(precioConMargen / 50) * 50;
  var pasajeros = Math.max(1, Math.min(4, Math.round(num(state.pasajeros, 1))));
  var precioPorPersona = precioRedondeado / pasajeros;

  return {
    distanciaTotal: distanciaTotal, tiempoManejoHoras: tiempoManejoHoras,
    costoGasolina: costoGasolina, costoCasetas: costoCasetas,
    costoManejo: costoManejo, costoEspera: costoEspera,
    costoTotal: costoTotal, precioConMargen: precioConMargen,
    precioRedondeado: precioRedondeado, pasajeros: pasajeros,
    precioPorPersona: precioPorPersona, esRedondo: esRedondo
  };
}

function tipoBtn(key, label){
  var active = state.tipoViaje === key;
  return '<button type="button" class="toggle-btn'+(active?' active':'')+'" data-action="setTipo" data-tipo="'+key+'">'+label+'</button>';
}

function render(){
  var r = calcular();
  var html =
    '<div class="wrap">'+
      '<header>'+
        '<div class="logo">M</div>'+
        '<div><h1>Cotizador Mayab</h1><p>Herramienta interna — no es parte del sitio público</p></div>'+
      '</header>'+

      '<div class="install-banner">📲 <b>Agrégala a tu pantalla de inicio</b> para abrirla como app: en Safari/Chrome toca Compartir → "Agregar a pantalla de inicio".</div>'+

      '<div class="card">'+
        '<h2>Viaje</h2>'+
        '<div class="row">'+
          '<div><label>Cliente</label><input type="text" value="'+state.cliente+'" data-bind="cliente" placeholder="Nombre"></div>'+
          '<div><label>Destino / zona</label><input type="text" value="'+state.destino+'" data-bind="destino" placeholder="ej. Bacalar"></div>'+
        '</div>'+
        '<label>Fecha del viaje</label>'+
        '<input type="date" value="'+state.fecha+'" data-bind="fecha">'+
      '</div>'+

      '<div class="card">'+
        '<h2>Distancia y tiempo (de Google Maps)</h2>'+
        '<div class="row">'+
          '<div><label>Km de ida</label><input type="number" inputmode="decimal" min="0" step="0.1" value="'+state.km+'" data-bind="km" placeholder="ej. 120"></div>'+
          '<div><label>Minutos de ida</label><input type="number" inputmode="numeric" min="0" step="1" value="'+state.minIda+'" data-bind="minIda" placeholder="ej. 90"></div>'+
        '</div>'+
        '<label>Tipo de viaje</label>'+
        '<div class="toggle-group">'+
          tipoBtn('redondo_espera', 'Redondo, con espera')+
          tipoBtn('redondo_sin_espera', 'Redondo, sin espera')+
          tipoBtn('ida_sin_regreso', 'Solo ida (te recogen otro día)')+
        '</div>'+
        '<div class="hint">'+(r.esRedondo?'Regresas manejando el mismo día — se cobra gasolina y caseta de ida y vuelta, aunque el cliente solo pague "el viaje".':'El cliente paga solo el tramo de ida y tú no regresas manejando ese mismo tramo (p. ej. te recogen después) — no se duplica gasolina ni caseta.')+'</div>'+
      '</div>'+

      '<div class="card">'+
        '<h2>Espera y casetas</h2>'+
        '<div class="row">'+
          '<div><label>Horas de espera en destino</label><input type="number" inputmode="decimal" min="0" step="0.5" value="'+state.horasEspera+'" data-bind="horasEspera"></div>'+
          '<div><label>Pasajeros (1–4)</label><input type="number" inputmode="numeric" min="1" max="4" step="1" value="'+state.pasajeros+'" data-bind="pasajeros"></div>'+
        '</div>'+
        '<div class="row">'+
          '<div><label>Caseta de ida (MXN)</label><input type="number" inputmode="decimal" min="0" step="1" value="'+state.casetaIda+'" data-bind="casetaIda"></div>'+
          '<div><label>Caseta de vuelta (MXN)</label><input type="number" inputmode="decimal" min="0" step="1" value="'+state.casetaVuelta+'" data-bind="casetaVuelta" placeholder="igual a la de ida si se deja en 0" '+(r.esRedondo?'':'disabled')+'></div>'+
        '</div>'+
      '</div>'+

      '<div class="card">'+
        '<button type="button" class="adv-toggle" data-action="toggleAdv">'+(state.advOpen?'▾':'▸')+' Supuestos del modelo (editable)</button>'+
        '<div class="adv-body'+(state.advOpen?' open':'')+'">'+
          '<div class="row">'+
            '<div><label>Gasolina ($/km)</label><input type="number" inputmode="decimal" min="0" step="0.05" value="'+state.precioGas+'" data-bind="precioGas"></div>'+
            '<div><label>Margen (%)</label><input type="number" inputmode="numeric" min="0" step="1" value="'+state.margen+'" data-bind="margen"></div>'+
          '</div>'+
          '<div class="row">'+
            '<div><label>Hora de manejo ($/h)</label><input type="number" inputmode="numeric" min="0" step="10" value="'+state.tarifaManejo+'" data-bind="tarifaManejo"></div>'+
            '<div><label>Hora de espera ($/h)</label><input type="number" inputmode="numeric" min="0" step="10" value="'+state.tarifaEspera+'" data-bind="tarifaEspera"></div>'+
          '</div>'+
          '<div class="hint">Estos valores se guardan en este teléfono y se usan la próxima vez que abras la calculadora.</div>'+
        '</div>'+
      '</div>'+

      '<div class="result">'+
        '<div class="label">Precio sugerido</div>'+
        '<div class="price">'+money(r.precioRedondeado)+'</div>'+
        (r.pasajeros>1?'<div class="sub">'+money(r.precioPorPersona)+' / persona si lo divides entre '+r.pasajeros+'</div>':'<div class="sub">Tarifa plana por vehículo</div>')+
        '<div class="breakdown">'+
          '<div><span>Distancia total (ida'+(r.esRedondo?'+vuelta':'')+')</span><strong>'+r.distanciaTotal.toFixed(1)+' km</strong></div>'+
          '<div><span>Gasolina</span><strong>'+money(r.costoGasolina)+'</strong></div>'+
          '<div><span>Casetas</span><strong>'+money(r.costoCasetas)+'</strong></div>'+
          '<div><span>Manejo ('+r.tiempoManejoHoras.toFixed(1)+' h)</span><strong>'+money(r.costoManejo)+'</strong></div>'+
          '<div><span>Espera</span><strong>'+money(r.costoEspera)+'</strong></div>'+
          '<div><span>Costo total (piso)</span><strong>'+money(r.costoTotal)+'</strong></div>'+
        '</div>'+
        '<div class="action-row">'+
          '<a class="action-btn cal" href="'+gcalLink(r)+'" target="_blank" rel="noopener">📅 Agregar a Calendar</a>'+
          '<a class="action-btn reg" href="'+regLink(r)+'" target="_blank" rel="noopener">✅ Confirmar y registrar reserva</a>'+
        '</div>'+
        '<div class="hint" style="margin-top:8px;color:rgba(255,255,255,0.75)">Al confirmar, el viaje se guarda solo como "reservado" en tu registro — ahí lo marcas completado cuando termine.</div>'+
      '</div>'+

      '<p class="footer-note">Mismo modelo que tarifario_destinos_mayab.xlsx: gasolina real + casetas + $/hora de manejo y espera + margen, redondeado a $50. Ajusta el precio final con tu criterio de mercado antes de cotizar.</p>'+
    '</div>';

  document.getElementById('app').innerHTML = html;
  attachListeners();
}

function attachListeners(){
  var root = document.getElementById('app');
  root.querySelectorAll('[data-bind]').forEach(function(el){
    el.addEventListener('input', function(){
      var key = el.getAttribute('data-bind');
      var caret = el.selectionStart;
      state[key] = el.value;
      if (['precioGas','tarifaManejo','tarifaEspera','margen'].indexOf(key) !== -1){
        state[key] = num(el.value, state[key]);
        saveDefaults();
      }
      render();
      var again = root.querySelector('[data-bind="'+key+'"]');
      if (again){
        again.focus();
        try{ again.setSelectionRange(caret, caret); }catch(e){}
      }
    });
  });
  root.querySelectorAll('[data-action="setTipo"]').forEach(function(btn){
    btn.addEventListener('click', function(){ state.tipoViaje = btn.getAttribute('data-tipo'); render(); });
  });
  var advBtn = root.querySelector('[data-action="toggleAdv"]');
  if (advBtn) advBtn.addEventListener('click', function(){ state.advOpen = !state.advOpen; render(); });
}

loadDefaults();
render();

if ('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('/cotizador/sw.js').catch(function(){});
  });
}
</script>
</body>
</html>
